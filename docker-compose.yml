services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Persist app data (users, exports, logs, encryption key) across restarts.
      - app_data:/app/data
      - app_keys:/app/keys
      - app_logs:/app/logs
    environment:
      # Redis is optional; enable it by setting REDIS_ENABLED=true.
      - REDIS_ENABLED=false
      - REDIS_URL=redis://redis:6379/0
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=50
      - MAX_FILE_SIZE=52428800
      - CHUNK_SIZE=1048576
      - UPLOAD_TIMEOUT=60
      # Production defaults. DEBUG must stay off outside local dev.
      - DEBUG=false
      - APP_ENV=production
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      # REQUIRED: set a strong, unique secret before deploying. The app falls back
      # to an insecure default if this is unset — do not rely on that fallback.
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in a .env file or your shell before starting}
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s

  # Optional: uncomment to run Redis for caching/session storage in Docker,
  # and set REDIS_ENABLED=true on the app service above.
  # redis:
  #   image: redis:7-alpine
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped
  #   networks:
  #     - app_network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 3

volumes:
  app_data:
  app_keys:
  app_logs:
  # redis_data:

networks:
  app_network:
    driver: bridge
